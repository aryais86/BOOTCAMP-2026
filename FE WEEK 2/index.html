<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Posts</h2>
    <div>
        <input id="searchInput" type="text" placeholder="Search by title" />
        <select id="sortField">
            <option value="id">Sort by ID</option>
            <option value="title">Sort by Title</option>
            <option value="body">Sort by Body</option>
        </select>
        <select id="sortOrder">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>
        <button id="addItemBtn" type="button">Add Item</button>
    </div>

    <table id="myTable" border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Body</th>
        </tr>
    </table>

    <div style="margin-top: 10px;">
        <button id="prevBtn" type="button">Previous</button>
        <button id="nextBtn" type="button">Next</button>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Add New Post</h3>
            <form id="addItemForm" novalidate>
                <div class="form-row">
                    <label for="titleInput">Title</label>
                    <input id="titleInput" type="text" />
                    <span class="error-message" id="titleError"></span>
                </div>

                <div class="form-row">
                    <label for="bodyInput">Body</label>
                    <textarea id="bodyInput" rows="4"></textarea>
                    <span class="error-message" id="bodyError"></span>
                </div>

                <div class="form-actions">
                    <button type="submit">Save</button>
                    <button type="button" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
